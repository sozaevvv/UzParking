<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UzParking — Smart Mobility Tashkent</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{--bg:#F8FAFC;--card:#FFFFFF;--fg:#0F172A;--mut:#64748B;--bd:#E2E8F0;--ink:#0F172A;--inkfg:#FFFFFF;--map:#EEF2F7;--free:#10B981;--ev:#3B82F6;--occ:#F43F5E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060B18;--card:#0F172A;--fg:#F1F5F9;--mut:#94A3B8;--bd:#1E293B;--ink:#F1F5F9;--inkfg:#0F172A;--map:#0B1426}}
.dk{--bg:#060B18;--card:#0F172A;--fg:#F1F5F9;--mut:#94A3B8;--bd:#1E293B;--map:#0B1426;color:var(--fg)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.frame{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
@media (min-width:431px){.frame{box-shadow:0 25px 50px -12px rgba(0,0,0,.25);border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px}
.mut{color:var(--mut)}
.inp{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;font-weight:600;font-size:14px;outline:none;color:var(--fg)}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:16px;padding:15px;font-weight:700;font-size:15px;background:var(--ink);color:var(--inkfg);transition:transform .15s}
.btn:active{transform:scale(.98)}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.pill{padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--bd);background:var(--card);white-space:nowrap;transition:all .2s}
.pill.on{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.bay{height:68px;border-radius:8px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;transition:transform .15s,background .25s}
.bay:active{transform:scale(.93)}
.b-f{background:color-mix(in srgb,var(--free) 14%,var(--card));border-color:var(--free);color:var(--free)}
.b-e{background:color-mix(in srgb,var(--ev) 16%,var(--card));border-color:var(--ev);color:var(--ev)}
.b-o{background:color-mix(in srgb,var(--occ) 14%,var(--card));border-color:var(--occ);color:var(--occ)}
.b-b{background:#0F172A;border-color:#334155;color:#fff}
.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(100%)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.8s ease-out infinite}@keyframes pl{from{transform:scale(.8);opacity:.5}to{transform:scale(2.2);opacity:0}}
.draw{stroke-dasharray:90;stroke-dashoffset:90;animation:dr .9s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.spin{animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .3s ease}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
#splash{transition:opacity .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden;position:relative;touch-action:none;isolation:isolate}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}.leaflet-zoom-anim .leaflet-tile{transition:none}
.leaflet-tile-pane{z-index:200}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-pane{z-index:400}
.leaflet-marker-icon.leaflet-interactive{cursor:pointer;pointer-events:auto}.leaflet-tooltip{position:absolute;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none}
#lf{background:var(--map) repeating-linear-gradient(0deg,transparent 0 39px,#0001 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#0001 39px 40px)}
:root[data-theme="dark"]{--bg:#060B18;--card:#0F172A;--fg:#F1F5F9;--mut:#94A3B8;--bd:#1E293B;--ink:#F1F5F9;--inkfg:#0F172A;--map:#0B1426}
[data-a]{cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<div id="splash" class="fixed inset-0 z-[60] flex flex-col items-center justify-center" style="background:#0F172A;color:#fff"><div id="splogo"></div><div class="mt-5 text-2xl font-extrabold tracking-tight">UzParking</div><div class="mt-1 text-sm opacity-60">Smart Urban Mobility • Tashkent • build v8</div></div>
<div id="app" class="frame"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 top-4 z-[70] hidden px-4 py-2 rounded-full text-sm font-semibold shadow-lg" style="background:var(--ink);color:var(--inkfg)"></div>
<div id="overlay"></div><div id="bm"></div><div id="pa"></div><div id="st"></div>
<script>
const LFL=window.L;const LOGO=(s=36)=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="#0F172A"/><path class="draw" d="M17 37V13h8.5a7.5 7.5 0 010 15H17" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25.5" cy="20.5" r="2.6" fill="#10B981"/><path d="M27 37q2.5-3 5 0t5 0" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/></svg>`;
{const l=document.createElement('link');l.rel='icon';l.type='image/svg+xml';l.href='data:image/svg+xml,'+encodeURIComponent(LOGO(64));document.head.appendChild(l)}
document.getElementById('splogo').innerHTML=LOGO(84);
setTimeout(()=>document.getElementById('splash').style.opacity=0,900);setTimeout(()=>document.getElementById('splash').remove(),1200);

const LOCS=[['tcm','Tashkent City Mall','Sayilgoh St, Yunusabad','EV chargers',['A1','A2','B1','B2'],41.3446,69.2838,62,8,2.1],['mgc','Magic City Park','Amir Temur Ave','Family park',['A8'],41.3096,69.2528,70,10,4.8],['alay','Alay Bazaar (Oloy)','Mirzo Ulugbek district','High demand',[],41.3367,69.3345,82,6,3.4],['chor','Chorsu Bazaar','Eski Shahar','Old city',[],41.3268,69.2347,88,-4,1.2],['tas','Tashkent Intl. Airport (TAS)','Sergeli, Airport Rd','Short-stay',['A1','B8'],41.2579,69.2812,55,9,7.9],['meg','Mega Planet','Yunusabad','Shopping',['A1'],41.3571,69.2837,66,5,3],['sam','Samarkand Darvoza','Shaykhontohur','Mall',[],41.3283,69.2064,48,10,5.2],['nxt','Next Mall','Mirabad','Mall',['B1','B2'],41.3631,69.3009,58,7,5.6],['sqr','Amir Temur Square','City center','Center',[],41.3111,69.2797,72,8,.8],['rly','Railway Station','Tashkent-Central','Transit',[],41.2916,69.2791,68,-6,3.9],['exp','Uzexpocentre','Mirzo Ulugbek','Events',['A1','A2'],41.3469,69.2975,35,12,4.4],['nav','Navoi Theatre','Mirabad','Culture',[],41.3059,69.2684,60,9,1.9]].map(([id,name,area,tag,ev,la,lo,b,tr,dist])=>({id,name,area,tag,ev,la,lo,b,tr,dist,occ:Math.round(b*.16),x:(lo-69.19)/.16*300+20,y:(41.375-la)/.13*180+15}));
const IDS=[...'AB'].flatMap(r=>[1,2,3,4,5,6,7,8].map(n=>r+n));
const PAYS=[['wallet','UzParking Wallet','wallet'],['Payme','Payme','credit-card'],['Click','Click','credit-card'],['Uzum Bank','Uzum Bank','credit-card']];
const DURS=[[1,'1h'],[2,'2h'],[3,'3h'],[5,'5h'],[10,'All Day']];
const KEY='uzparking_pro_v2';
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' UZS';
const I=(n,c='w-4 h-4')=>`<i data-lucide="${n}" class="${c}"></i>`;
const L=id=>LOCS.find(l=>l.id===id);
function DEFC(){return[{mask:'9860 1766 •••• 4802',full:'9860176619784802',name:'',exp:'09/28',brand:'Humo'}]}
function seed(){const spots={};LOCS.forEach((l,k)=>{const m={},h=a=>((k*7+IDS.indexOf(a)*5+3)*2654435761>>>0)%1000;IDS.forEach(i=>m[i]='f');IDS.slice().sort((a,b)=>h(a)-h(b)).slice(0,l.occ).forEach(i=>m[i]='o');if(l.id==='tcm'){m.A1='f';m.B2='f'}spots[l.id]=m});return spots}
const def=()=>({acct:null,session:false,cars:[],car:0,wallet:250000,spots:seed(),booking:null,hist:[],revenue:0,fines:[],bank:{Payme:3000000,Click:1500000,'Uzum Bank':2000000},cards:DEFC(),cs:0});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.spots)S=def();if(!S.bank)S.bank={Payme:3000000,Click:1500000,'Uzum Bank':2000000};if(!S.cards)S.cards=DEFC();if(S.cs==null)S.cs=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
window.addEventListener('storage',e=>{if(e.key===KEY){try{S=JSON.parse(e.newValue)||def();render()}catch(x){}}});
let ui={t:0,bm:0,sel:null,scan:null,mode:'driver',tab:'explore',filter:'all',loc:null,opLoc:'tcm',sheet:null,at:'in',step:'form',f:{},err:'',pend:null,addCar:false};
const free=id=>Object.values(S.spots[id]).filter(v=>v==='f').length;
const fr=l=>{const f=free(l.id);return ui.t?Math.max(0,Math.min(16,f-Math.round(l.tr*ui.t*.16))):f};
const ld=l=>(16-fr(l))/16*100;const TR=l=>{const x=ld(l);return x<40?0:x<=85?1:2};
const P=l=>[5000,8000,14000][TR(l)];const TC=l=>['var(--free)','#F59E0B','var(--occ)'][TR(l)];
const fb=()=>{const m=S.fines.filter(f=>S.cars.some(c=>c.plate.replace(/\s/g,'')===f.plate.replace(/\s/g,'')));return m.length?`<div class="card p-3 mb-3 flex items-center justify-between" style="border-color:var(--occ)"><div><b class="text-sm" style="color:var(--occ)">Fine · ${fmt(440000)}</b><div class="text-xs mut">${m[0].plate}: no valid booking</div></div><button data-a="payfine" class="pill on">Pay</button></div>`:''};
const dg=s=>(s||'').replace(/\D/g,'');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2200)}
const price=(l,d,m)=>Math.round(P(l)*(d-.25))+(m?2500:0);
const plateTag=p=>`<span class="inline-flex rounded-md overflow-hidden border border-slate-300 align-middle"><span class="bg-blue-600 text-white text-[9px] font-bold px-1 flex items-center">UZ</span><span class="bg-white text-slate-900 font-extrabold tracking-wider px-2 py-0.5 text-sm">${p}</span></span>`;

/* ---------- Auth ---------- */
const inp=(k,lab,ph,t='text')=>`<label class="block mb-3"><span class="text-xs font-semibold mut">${lab}</span><input data-k="${k}" type="${t}" value="${ui.f[k]||''}" placeholder="${ph}" class="inp mt-1"></label>`;
function auth(){const up=ui.at==='up';
 return `<div class="px-5 pt-6 pb-10 min-h-screen flex flex-col fade"><div class="flex items-center justify-between"><div class="flex items-center gap-2">${LOGO(38)}<b class="text-lg tracking-tight">UzParking</b></div><button data-a="settings" class="pill">⚙ Settings</button></div>
 <h1 class="text-[32px] leading-[1.1] font-extrabold tracking-tight mt-10">Park smarter<br>across Tashkent.</h1><p class="mut text-sm mt-2 mb-6">Reserve a bay, pay with Payme or Click, and drive straight in.</p>
 ${ui.step==='otp'?`<div class="card p-5"><div class="font-bold">Enter SMS code</div><div class="text-xs mut mb-3">Sent to ${ui.pend.phone}. Auto-filled for the demo.</div><input id="otp" value="7777" maxlength="4" inputmode="numeric" class="inp text-center text-2xl tracking-[.6em] font-extrabold mb-2"><div class="text-xs mb-2" style="color:var(--occ)">${ui.err||'&nbsp;'}</div><button data-a="verify" class="btn">Verify and continue</button><button data-a="astep" class="btn ghost mt-2">Change number</button></div>`
 :`<div class="card p-5"><div class="grid grid-cols-2 p-1 rounded-2xl mb-4" style="background:var(--bg)">${[['in','Sign In'],['up','Create Account']].map(([k,t])=>`<button data-a="atab" data-id="${k}" class="py-2 rounded-xl text-sm font-bold" style="${ui.at===k?'background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)':'color:var(--mut)'}">${t}</button>`).join('')}</div>
 ${up?inp('name','Full name','Aziz Karimov'):''}${inp('phone','Phone number','+998 90 123 45 67','tel')}${up?inp('plate','Vehicle plate','01 A 777 AA')+inp('model','Car model','BYD Song Plus'):''}
 <div class="text-xs mb-2" style="color:var(--occ)">${ui.err||'&nbsp;'}</div><button data-a="send" class="btn">${up?'Create account':'Send code'}</button></div>
 <button data-a="demo" class="btn ghost mt-3">${I('zap')} Continue as Demo User (1-Click Judge Access)</button>`}
 <p class="text-center text-xs mut mt-auto pt-8">Data stays on this device. Nothing is sent to a server. · build v8</p></div>`}

/* ---------- Shared ---------- */
function lot(l,act){const m=S.spots[l.id];
 const row=r=>`<div class="grid grid-cols-8 gap-1">${IDS.filter(i=>i[0]===r).map(i=>{const v=m[i],ev=l.ev.includes(i);const c=v==='o'?'o':v==='b'?'b':ev?'e':'f';const ic=v==='o'?'car':v==='b'?'ticket':ev?'zap':'circle';return `<button data-a="${act}" data-id="${i}" class="bay b-${c}">${I(ic,'w-4 h-4')}${i}</button>`}).join('')}</div>`;
 return `<div class="card p-3"><div class="flex justify-between text-[11px] font-bold mb-2"><span class="flex items-center gap-1" style="color:var(--free)">${I('log-in','w-3.5 h-3.5')} Entry gate</span><span class="flex items-center gap-1 mut">Exit gate ${I('log-out','w-3.5 h-3.5')}</span></div>
 <div class="text-[10px] mut mb-1">Zone A</div>${row('A')}<div class="my-2 h-9 rounded-lg flex items-center justify-around mut" style="background:var(--bg);border-top:2px dashed var(--bd);border-bottom:2px dashed var(--bd)">${I('arrow-right')+I('arrow-right')+I('arrow-right')+I('arrow-right')}</div><div class="text-[10px] mut mb-1">Zone B</div>${row('B')}</div>
 <div class="flex flex-wrap justify-center gap-x-4 gap-y-1 text-[11px] mut mt-3"><span><b style="color:var(--free)">■</b> Available</span><span><b style="color:var(--ev)">■</b> EV charging</span><span><b style="color:var(--occ)">■</b> Occupied</span><span><b style="color:#334155">■</b> Reserved</span></div>`}
function head(){return `<div class="flex items-center justify-between px-4 pt-4 pb-3"><div class="flex items-center gap-2">${LOGO(32)}<b class="tracking-tight">UzParking</b><button data-a="settings" class="pill ml-1" style="padding:4px 9px">⚙</button></div>
 <div class="flex p-1 rounded-full" style="background:var(--ink)">${[['driver','Driver App'],['op','ANPR & IoT Admin']].map(([k,t])=>`<button data-a="mode" data-id="${k}" class="px-3 py-1.5 rounded-full text-xs font-bold" style="${ui.mode===k?'background:var(--card);color:var(--fg)':'color:var(--inkfg);opacity:.7'}">${t}</button>`).join('')}</div></div>`}

/* ---------- Explore ---------- */
function list(){let a=LOCS.slice();if(ui.filter==='ev')a=a.filter(l=>l.ev.length);if(ui.filter==='near')a.sort((x,y)=>x.dist-y.dist);if(ui.filter==='price')a.sort((x,y)=>P(x)-P(y));return a}
const col=f=>f===0?'var(--occ)':f<5?'#F59E0B':'var(--free)';
function explore(){
 if(ui.loc){const l=L(ui.loc),f=free(l.id);return `<div class="px-4 pb-32 fade"><button data-a="back" class="flex items-center gap-1 text-sm font-semibold mut mb-2">${I('arrow-left')} All locations</button><div class="flex justify-between items-end mb-3"><div><h2 class="text-xl font-extrabold tracking-tight leading-tight">${l.name}</h2><div class="text-sm mut">${fmt(P(l))}/hr · first 15 min free</div></div><div class="text-right"><div class="text-2xl font-extrabold leading-none" style="color:${TC(l)}">${f}</div><div class="text-xs mut">free</div></div></div>${lot(l,'spot')}<button data-a="route" data-id="${l.id}" class="btn ghost mt-3">${I('navigation')} Route to this parking</button><p class="text-center text-sm mut mt-3">Tap an available bay to book it.</p></div>`}
 const vis=list().map(l=>l.id);
 const road=(d,id,name)=>`<path id="${id}" d="${d}" fill="none" stroke="var(--bd)" stroke-width="12" stroke-linecap="round"/><path d="${d}" fill="none" stroke="var(--card)" stroke-width="9" stroke-linecap="round"/><text font-size="7" font-weight="700" fill="var(--mut)"><textPath href="#${id}" startOffset="8%">${name}</textPath></text>`;
 return `<div class="px-4 pb-32 fade"><div class="text-sm mut">Hello, ${S.acct.name.split(' ')[0]}</div>${fb()}<h2 class="text-2xl font-extrabold tracking-tight mb-3">Find parking</h2>${fc()}
 <div class="flex gap-2 overflow-x-auto pb-3 -mx-4 px-4">${[['all','All'],['ev','EV Charging ⚡'],['near','Nearest'],['price','Lowest Price']].map(([k,t])=>`<button data-a="flt" data-id="${k}" class="pill ${ui.filter===k?'on':''}">${t}</button>`).join('')}</div>
 <div class="relative mb-4" data-a="bigmap"><svg viewBox="0 0 340 210" class="w-full rounded-3xl" style="background:var(--map);border:1px solid var(--bd)"><rect x="20" y="20" width="70" height="50" rx="10" fill="var(--free)" opacity=".12"/><rect x="210" y="125" width="80" height="35" rx="10" fill="var(--ev)" opacity=".08"/>
 ${road('M10 165Q120 120 210 105T335 62','r1','Amir Temur Ave')}${road('M5 70Q120 95 335 150','r2','Navoi St')}${road('M120 -5Q145 100 105 215','r3','Islam Karimov St')}
 <circle cx="150" cy="112" r="5" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/>
 ${LOCS.map(l=>{const f=fr(l),c=TC(l),o=vis.includes(l.id)?1:.2;return `<g data-a="loc" data-id="${l.id}" style="cursor:pointer;opacity:${o}"><circle class="pulse" cx="${l.x}" cy="${l.y}" r="11" fill="${c}"/><circle cx="${l.x}" cy="${l.y}" r="12" fill="${c}" stroke="#fff" stroke-width="2.5"/><text x="${l.x}" y="${l.y+4}" font-size="11" font-weight="800" text-anchor="middle" fill="#fff">${f}</text></g>`}).join('')}</svg><button data-a="bigmap" class="absolute right-2 bottom-2 px-3 py-1.5 rounded-full text-xs font-bold shadow-lg" style="background:var(--ink);color:var(--inkfg)">⤢ Open Tashkent map</button></div>
 <div class="space-y-3">${list().map(l=>{const f=fr(l);return `<button data-a="loc" data-id="${l.id}" class="card p-4 w-full text-left flex gap-3 items-center"><div class="w-11 h-11 rounded-2xl grid place-items-center shrink-0" style="background:color-mix(in srgb,${TC(l)} 15%,var(--card));color:${TC(l)}">${I(l.ev.length?'zap':'map-pin','w-5 h-5')}</div><div class="min-w-0 flex-1"><div class="font-bold leading-tight">${l.name}</div><div class="text-xs mut">${l.dist} km · ${l.tag}${l.ev.length&&l.tag!=='EV chargers'?' · EV':''}</div></div><div class="text-right shrink-0"><div class="font-extrabold text-sm">${fmt(P(l))}</div><div class="text-xs font-semibold" style="color:${TC(l)}">${f} free${f<=3&&f>0?' · busy':''}</div></div></button>`}).join('')||'<div class="mut text-sm text-center py-6">No locations match.</div>'}</div></div>`}

/* ---------- Booking sheet ---------- */
function sheet(){const s=ui.sheet;if(!s)return '';const l=L(ui.loc),tot=price(l,s.d,s.mt),car=S.cars[s.car];
 return `<div class="fixed inset-0 z-40" style="background:rgba(2,6,23,.55)" data-a="close"><div class="sheet absolute bottom-0 left-0 right-0 max-w-[430px] mx-auto p-5 overflow-auto" style="background:var(--card);color:var(--fg);border-radius:28px 28px 0 0;max-height:92vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))">
 <div class="flex justify-between items-start mb-4"><div><div class="text-xl font-extrabold tracking-tight">Bay ${s.spot}${l.ev.includes(s.spot)?' ⚡':''}</div><div class="text-xs mut">${l.name} · ${fmt(P(l))}/hr</div></div><span class="text-[11px] font-bold px-2.5 py-1 rounded-full" style="background:color-mix(in srgb,var(--free) 16%,var(--card));color:var(--free)">First 15 mins free</span></div>

document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k==='cn'||k==='ce'){const d=dg(e.target.value);ui.f[k]=k==='cn'?d.slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 '):d.slice(0,4).replace(/(\d{2})(?=\d)/,'$1/');e.target.value=ui.f[k];ui.stErr='';return}if(k){ui.f[k]=/plate|scanp|^ch$/.test(k)?e.target.value.toUpperCase():e.target.value;if(/plate|scanp|^ch$/.test(k))e.target.value=ui.f[k];ui.err=''}});
function showErr(x){let e=document.getElementById('err');if(!e){e=document.createElement('div');e.id='err';e.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#B91C1C;color:#fff;padding:8px 10px;border-radius:10px;font:12px monospace';document.body.appendChild(e)}e.textContent='Error: '+((x&&x.message)||x)}
window.addEventListener('error',ev=>showErr(ev.error||ev.message));
document.addEventListener('click',e=>{try{H0(e)}catch(x){showErr(x)}});
function H0(e){const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,f=ui.f;if((a==='close'||a==='stx')&&e.target!==t)return;
 if(a==='atab'){ui.at=id;ui.err=''}
 else if(a==='astep'){ui.step='form';ui.err=''}
 else if(a==='demo'){S.acct={name:'Aziz Karimov',phone:'+998 90 123 45 67'};S.cars=DEMO_CARS.map(c=>({...c}));S.car=0;S.session=true;ui.tab='explore';save()}
 else if(a==='send'){if(ui.at==='up'){if(!(f.name||'').trim()||dg(f.phone).length<9||!(f.plate||'').trim()||!(f.model||'').trim()){ui.err='Fill in every field, including a full phone number.';render();return}ui.pend={name:f.name.trim(),phone:f.phone,plate:f.plate.trim(),model:f.model.trim()}}
  else{if(!S.acct||dg(f.phone)!==dg(S.acct.phone)){ui.err='No account for this number. Create one or use Demo User.';render();return}ui.pend=S.acct}ui.step='otp';ui.err=''}
 else if(a==='verify'){if(document.getElementById('otp').value!=='7777'){ui.err='Wrong code. Use 7777.';render();return}const p=ui.pend;if(ui.at==='up'){S.acct={name:p.name,phone:p.phone};S.cars=[{plate:p.plate,model:p.model}];S.car=0;S.wallet=250000}S.session=true;ui.step='form';ui.tab='explore';ui.f={};save()}
 else if(a==='mode'){ui.mode=id;ui.sheet=null}
 else if(a==='tab'){ui.tab=id;ui.loc=null;ui.err='';ui.addCar=false}
 else if(a==='flt')ui.filter=id;
 else if(a==='loc'){ui.loc=id;ui.tab='explore'}
 else if(a==='back')ui.loc=null;
 else if(a==='spot'){const v=S.spots[ui.loc][id];if(v!=='f'){toast(v==='o'?'Bay '+id+' is occupied':'Bay '+id+' is reserved');return}if(S.booking){toast('Finish your current pass first');return}ui.sheet={spot:id,d:1,car:S.car,pm:'wallet',mt:0}}
 else if(a==='close')ui.sheet=null;
 else if(a==='dur')ui.sheet.d=+id;
 else if(a==='mt')ui.sheet.mt=!ui.sheet.mt;
 else if(a==='ft')ui.t=+id;
 else if(a==='rmt'){ui.rm=ui.rm===0?1:0;bmUI();return}
 else if(a==='route'){if(!ui.bm)openMap();route(id);return}
 else if(a==='bigmap')openMap();
 else if(a==='bmclose'||a==='bmgo'){closeMap();if(a==='bmgo'){ui.loc=id;ui.tab='explore'}}
 else if(a==='scan')doScan(ui.f.scanp);
 else if(a==='scanb')doScan(S.booking?S.booking.plate:S.cars[0].plate);
 else if(a==='scanr')doScan(['30 K 912 MM','75 X 021 TT','10 B 456 CA'][Math.floor(Math.random()*3)]);
 else if(a==='payfine'){if(S.wallet<440000){toast('Wallet too low');return}S.wallet-=440000;S.fines=S.fines.filter(f=>!S.cars.some(c=>c.plate.replace(/\s/g,'')===f.plate.replace(/\s/g,'')));save();toast('Fine paid')}
 else if(a==='scar')ui.sheet.car=+id;
 else if(a==='pm'){ui.sheet.pm=id;ui.sheet.err=''}
 else if(a==='pay'){const s=ui.sheet,l=L(ui.loc),tot=price(l,s.d,s.mt);if(s.busy)return;if(s.pm==='wallet'&&S.wallet<tot){s.err='Wallet balance too low. Pick another method or top up.';render();return}
  if(s.pm!=='wallet'){ui.pa={app:s.pm,mode:'pay',amt:tot,step:'redir'};openPA();return}
  s.busy=true;render();setTimeout(()=>{if(S.spots[l.id][s.spot]!=='f'){ui.sheet=null;toast('Bay just taken. Pick another');render();return}const c=S.cars[s.car];
   S.spots[l.id][s.spot]='b';if(s.pm==='wallet')S.wallet-=tot;S.revenue+=tot;S.booking={id:Math.random().toString(36).slice(2,8).toUpperCase(),loc:l.id,spot:s.spot,d:s.d,plate:c.plate,model:c.model,pm:s.pm,price:tot,end:Date.now()+s.d*3600000,status:'reserved',rate:P(l),mt:s.mt};
   save();ui.sheet=null;ui.loc=null;ui.tab='pass';toast('Payment successful');render()},1200);return}
 else if(a==='entry'){S.booking.status='parked';save();toast('Barrier opened. Welcome!')}
 else if(a==='exit'){const b=S.booking;S.spots[b.loc][b.spot]='f';S.hist.unshift({loc:L(b.loc).name,spot:b.spot,plate:b.plate,price:b.price,date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})});S.booking=null;save();toast('Session finished. Bay released')}
 else if(a==='topup'){ui.pa={app:'Payme',mode:'top',amt:100000,step:'redir'};openPA();return}
 else if(a==='settings'){ui.st=1;ui.stErr='';setUI();return}
 else if(a==='stc'||a==='stx'){ui.st=0;setUI();return}
 else if(a==='sth'){ST.theme=id;saveST();applyTheme();setUI();return}
 else if(a==='stl'){ST.lang=id;saveST();applyTheme();render();if(ui.bm)bmUI();if(ui.pa)paUI();setUI();return}
 else if(a==='stcs'){S.cs=+id;save();setUI();return}
 else if(a==='pacard'){S.cs=+id;save();paUI();startType();return}
 else if(a==='stdel'){if(S.cards.length<2){ui.stErr='Keep at least one card';setUI();return}S.cards.splice(+id,1);S.cs=0;save();setUI();return}
 else if(a==='stadd'){const d=dg(ui.f.cn),ex=ui.f.ce||'',m=+ex.slice(0,2);if(d.length!==16){ui.stErr='Enter a 16-digit card number';setUI();return}if(!/^\d\d\/\d\d$/.test(ex)||m<1||m>12){ui.stErr='Enter expiry as MM/YY';setUI();return}S.cards.push({mask:d.slice(0,4)+' •••• •••• '+d.slice(12),full:'',name:(ui.f.ch||'').trim(),exp:ex,brand:/^8600/.test(d)?'Uzcard':/^9860/.test(d)?'Humo':d[0]==='4'?'Visa':d[0]==='5'?'Mastercard':'Card'});S.cs=S.cards.length-1;ui.f.cn=ui.f.ch=ui.f.ce='';ui.stErr='';save();toast('Card added');setUI();return}
 else if(a==='theme'){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dk?'light':'dark'}
 else if(a==='paapp'){ui.pa.app=id;ui.pa.err='';paUI();startType();return}
 else if(a==='paamt'){ui.pa.amt=+id;ui.pa.err='';paUI();return}
 else if(a==='paadd'){S.bank[ui.pa.app]+=500000;ui.pa.err='';save();paUI();return}
 else if(a==='papay'){const p=ui.pa;if(!p.cardOk)return;if(S.bank[p.app]<p.amt){p.err='Not enough funds on this card';paUI();return}p.err='';p.step='pin';paUI();return}
 else if(a==='paconf'){const p=ui.pa;if(document.getElementById('pin').value!=='7777'){p.err='Wrong code. Use 7777.';paUI();return}p.step='busy';paUI();setTimeout(()=>{S.bank[p.app]-=p.amt;if(p.mode==='top'){S.wallet+=p.amt;toast('Wallet topped up')}else payDone();p.step='ok';save();paUI();setTimeout(()=>{ui.pa=null;paUI();render()},1500)},1200);return}
 else if(a==='pacancel'){clearInterval(PT);ui.pa=null;paUI();return}
 else if(a==='addcar')ui.addCar=!ui.addCar;
 else if(a==='savecar'){if(!(f.plate2||'').trim()||!(f.model2||'').trim()){ui.err='Enter plate and model.';render();return}S.cars.push({plate:f.plate2.trim(),model:f.model2.trim()});S.car=S.cars.length-1;f.plate2=f.model2='';ui.addCar=false;ui.err='';save();toast('Vehicle added')}
 else if(a==='car'){S.car=+id;save()}
 else if(a==='logout'){S.session=false;ui.mode='driver';ui.at='in';save()}
 else if(a==='reset'){S=def();ui={...ui,loc:null,sheet:null,f:{},step:'form',at:'in',mode:'driver',tab:'explore'};save();toast('Demo data reset')}
 else if(a==='oploc')ui.opLoc=id;
 else if(a==='tog'){const m=S.spots[ui.opLoc];if(m[id]==='b'){toast('Bay '+id+' is reserved by a driver');return}m[id]=m[id]==='f'?'o':'f';save()}
 render()}
render();
